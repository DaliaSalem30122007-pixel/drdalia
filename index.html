<style>
  :root {
    --gold: #d4b46a;
    --gold-light: #eed9a4;
    --gold-dark: #a8873c;
    --bg: #0c0c0c;
    --card: #141414;
    --text: #f5efe2;
    --muted: #b9b2a3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 40px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,180,106,.14), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 110%, rgba(212,180,106,.08), transparent 60%);
    pointer-events: none;
  }
  .page { width: 100%; max-width: 420px; position: relative; z-index: 1; }

  .logo {
    width: 130px; height: 130px;
    object-fit: cover;
    border-radius: 50%;
    margin: 0 auto 26px;
    display: block;
    box-shadow: 0 0 0 1px rgba(212,180,106,.5), 0 0 40px rgba(212,180,106,.18);
  }
  .photo-wrap {
    width: 190px; height: 190px;
    margin: 0 auto 24px;
    position: relative;
  }
  .photo-wrap::before {
    content: '';
    position: absolute; inset: -7px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--gold-dark), var(--gold-light), var(--gold-dark), var(--gold-light), var(--gold-dark));
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .photo {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    position: relative;
    border: 4px solid #0c0c0c;
    display: block;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem;
    font-weight: 600;
    text-align: center;
    letter-spacing: .5px;
    background: linear-gradient(120deg, var(--gold-light), var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: .72rem;
    margin-top: 10px;
  }
  .divider {
    display: flex; align-items: center; gap: 14px;
    margin: 28px auto 30px;
    width: 78%;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .divider::after { background: linear-gradient(90deg, var(--gold), transparent); }
  .divider span { color: var(--gold); font-size: .8rem; }

  .roles { display: flex; flex-direction: column; gap: 12px; margin-bottom: 34px; }
  .role {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    text-align: center;
    color: var(--text);
    letter-spacing: 1px;
    font-weight: 500;
    padding: 10px 0;
    border-top: 1px solid rgba(212,180,106,.22);
    border-bottom: 1px solid rgba(212,180,106,.22);
  }
  .role em { color: var(--gold); font-style: italic; }

  .links { display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: flex; align-items: center; gap: 16px;
    background: var(--card);
    border: 1px solid rgba(212,180,106,.35);
    border-radius: 14px;
    padding: 15px 20px;
    text-decoration: none;
    color: var(--text);
    transition: all .35s ease;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(212,180,106,.14) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform .6s ease;
  }
  .btn:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(212,180,106,.16); }
  .btn:hover::after { transform: translateX(100%); }
  .btn .icon {
    width: 42px; height: 42px; flex-shrink: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(212,180,106,.22), rgba(212,180,106,.06));
    border: 1px solid rgba(212,180,106,.4);
  }
  .btn .icon svg { width: 20px; height: 20px; fill: var(--gold); }
  .btn .label { flex: 1; font-weight: 400; letter-spacing: 1.5px; font-size: .95rem; text-transform: uppercase; }
  .btn .arrow { color: var(--gold); font-size: 1.1rem; transition: transform .3s; }
  .btn:hover .arrow { transform: translateX(4px); }

  footer {
    margin-top: 44px;
    text-align: center;
    color: #6e6759;
    font-size: .75rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }
  footer .dot { color: var(--gold); margin: 0 6px; }

  .wa-doctor {
    background: linear-gradient(135deg, rgba(212,180,106,.18), rgba(212,180,106,.05));
    border-color: var(--gold);
    box-shadow: 0 0 22px rgba(212,180,106,.12);
  }

  @media (max-width: 380px) { h1 { font-size: 2.1rem; } }
</style>
</head>
